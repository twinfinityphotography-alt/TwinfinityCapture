<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twinfinity Captures | Editorial Photography Lookbook</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding-top:6rem;">
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <img src="assets/emblem.svg" alt="Twinfinity Emblem">
        <span>TWINFINITY LOOKBOOK</span>
      </a>
      <a href="index.html" class="btn btn-outline">Back to Studio</a>
    </div>
  </header>

  <main class="container section-padding">
    <div class="section-header">
      <div class="badge-pill">Full Portfolio Collection</div>
      <h2>Fashion &amp; 3D Spatial Lookbook</h2>
      <p>High-resolution studio portraits, fashion editorials, red carpet gala coverage, and 3D LiDAR spatial scans.</p>
    </div>

    <!-- Category Filters -->
    <div class="portfolio-filter-bar">
      <button class="portfolio-filter-btn active" data-category="All">All Works</button>
      <button class="portfolio-filter-btn" data-category="Portraits">Portraits</button>
      <button class="portfolio-filter-btn" data-category="Fashion">Fashion</button>
      <button class="portfolio-filter-btn" data-category="Events">Events</button>
      <button class="portfolio-filter-btn" data-category="Commercial">Commercial</button>
      <button class="portfolio-filter-btn" data-category="3D Spatial">3D Spatial</button>
    </div>

    <div id="portfolio-grid-container" class="portfolio-grid"></div>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
