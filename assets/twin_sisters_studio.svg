<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgTwin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="50%" stop-color="#141122"/>
      <stop offset="100%" stop-color="#040306"/>
    </linearGradient>
    <linearGradient id="twinCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgTwin)"/>
  <circle cx="400" cy="300" r="220" fill="url(#twinCyan)" opacity="0.1" filter="blur(60px)"/>

  <!-- Twin Cameras Vector Symbol -->
  <g transform="translate(280, 220)">
    <rect width="110" height="75" rx="12" fill="#131826" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="55" cy="37" r="22" fill="none" stroke="#00f2fe" stroke-width="3"/>
  </g>

  <g transform="translate(410, 220)">
    <rect width="110" height="75" rx="12" fill="#131826" stroke="#7f00ff" stroke-width="2"/>
    <circle cx="55" cy="37" r="22" fill="none" stroke="#7f00ff" stroke-width="3"/>
  </g>

  <text x="400" y="420" fill="#ffffff" font-family="Syne, sans-serif" font-size="28" font-weight="800" text-anchor="middle">TWIN SISTERS PHOTOGRAPHY STUDIO</text>
  <text x="400" y="460" fill="#00f2fe" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="2">ISLAMABAD &amp; RAWALPINDI, PAKISTAN</text>
</svg>
