<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="#06070b"/>
  <!-- Infinity Camera Lens Emblem -->
  <circle cx="70" cy="100" r="40" fill="none" stroke="url(#cyanGrad)" stroke-width="6"/>
  <circle cx="130" cy="100" r="40" fill="none" stroke="url(#cyanGrad)" stroke-width="6"/>
  <!-- Inner Aperture Blades -->
  <circle cx="70" cy="100" r="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="130" cy="100" r="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Center Shutter Dots -->
  <circle cx="70" cy="100" r="6" fill="url(#cyanGrad)"/>
  <circle cx="130" cy="100" r="6" fill="url(#cyanGrad)"/>
</svg>
