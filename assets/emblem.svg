<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Background -->
  <rect width="512" height="512" rx="96" fill="#0B0F19"/>

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanPurple)" stroke-width="12" filter="url(#glow)"/>

  <!-- Inner Metallic Gold Rim -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Camera Aperture Shutter Blades -->
  <g transform="translate(256, 256) scale(0.95)" stroke="url(#cyanPurple)" stroke-width="6" fill="none">
    <circle r="120" stroke="url(#cyanPurple)" stroke-width="4"/>

    <!-- Shutter Blades -->
    <path d="M 0 -120 L 70 -40 L 40 40 Z" fill="rgba(0, 242, 254, 0.15)"/>
    <path d="M 104 -60 L 40 70 L -40 40 Z" fill="rgba(127, 0, 255, 0.15)"/>
    <path d="M 104 60 L -30 100 L -50 0 Z" fill="rgba(0, 242, 254, 0.15)"/>
    <path d="M 0 120 L -70 40 L -40 -40 Z" fill="rgba(255, 215, 0, 0.15)"/>
    <path d="M -104 60 L -40 -70 L 40 -40 Z" fill="rgba(0, 242, 254, 0.15)"/>

    <!-- Center Lens -->
    <circle r="45" fill="#0B0F19" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle r="25" fill="url(#cyanPurple)"/>
  </g>

  <!-- Brand Text -->
  <text x="256" y="440" font-family="'Outfit', sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TWINFINITY</text>
</svg>
